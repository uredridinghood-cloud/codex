<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>실시간 투표 · 발표자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* ---------- 준비 화면 (방 만들기 / 열기 / 질문 편집) ---------- */
.page { max-width: 820px; margin: 0 auto; padding: 28px 16px 80px; }
.page > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.page > header h1 { font-size: 30px; }
.page > header .meta { color: var(--muted); font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.box h2 { font-size: 22px; margin-bottom: 14px; }
.box .row { margin-bottom: 14px; }
.box .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.box .hint a { color: var(--accent); word-break: break-all; }
.recent { margin-top: 24px; }
.recent h2 { font-size: 18px; margin-bottom: 10px; }
.recent ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.recent li button { width: 100%; justify-content: space-between; }
.recent .c { font-family: var(--f-mono); color: var(--muted); }

.editbar { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 12px 0; margin: -12px 0 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
.editbar .spacer { flex: 1; }
.saved { font-size: 13px; color: var(--muted); }
.codebadge { font-family: var(--f-mono); font-weight: 700; background: var(--board); color: #fff; border-radius: 8px; padding: 4px 10px; letter-spacing: .12em; }
.settings { display: grid; gap: 14px; margin-bottom: 20px; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.qlist { display: grid; gap: 14px; }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.qcard .head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.qcard .num { font-family: var(--f-display); font-size: 20px; color: var(--accent); min-width: 34px; }
.qcard select { min-height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: var(--card); }
.qcard .head .spacer { flex: 1; }
.iconbtn { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; font-size: 15px; }
.iconbtn:hover { border-color: var(--accent); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { display: flex; gap: 8px; align-items: center; }
.opt .letter { width: 24px; text-align: center; color: var(--muted); font-family: var(--f-mono); }
.opt .field { min-height: 42px; font-size: 16px; }
.qcard .field.title { font-size: 18px; font-weight: 600; }
.addq { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

/* ---------- 발표 화면 ---------- */
.stage { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--paper); }
.stage .strip { display: flex; align-items: center; gap: 16px; padding: 14px 28px; background: var(--board); color: #fff; }
.stage .strip .join { font-size: clamp(16px, 1.6vw, 24px); }
.stage .strip .join b { font-family: var(--f-mono); color: var(--chalk); letter-spacing: .14em; margin-left: 6px; }
.stage .strip .url { font-family: var(--f-mono); opacity: .85; font-size: clamp(13px, 1.2vw, 18px); }
.stage .strip .spacer { flex: 1; }
.stage .strip .people { font-size: clamp(15px, 1.4vw, 20px); white-space: nowrap; }
.stage .strip .miniqr { background: #fff; border-radius: 6px; padding: 4px; width: 64px; height: 64px; }
.stage .body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: clamp(20px, 3vw, 48px) clamp(24px, 5vw, 96px); overflow: auto; }

.lobby { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: clamp(24px, 4vw, 72px); align-items: center; }
.lobby .bigqr { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.08); width: min(42vh, 36vw); aspect-ratio: 1; }
.lobby .bigqr svg, .miniqr svg { width: 100%; height: 100%; display: block; }
.lobby h1 { font-size: clamp(32px, 4.4vw, 68px); margin-bottom: 18px; }
.lobby .how { font-size: clamp(18px, 1.9vw, 28px); color: var(--ink-2); margin: 0 0 8px; }
.lobby .how b { font-family: var(--f-mono); color: var(--ink); }
.lobby .bigcode { font-family: var(--f-mono); font-weight: 700; font-size: clamp(48px, 7vw, 120px); letter-spacing: .14em; color: var(--board); line-height: 1.1; margin: 10px 0 20px; }
.names { display: flex; flex-wrap: wrap; gap: 8px; max-height: 26vh; overflow: hidden; }
.names span { background: var(--accent-soft); color: var(--board); border-radius: 999px; padding: 4px 14px; font-size: clamp(14px, 1.3vw, 19px); animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.qview { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.qview .qhead { display: flex; align-items: baseline; gap: 18px; margin-bottom: clamp(18px, 3vh, 40px); }
.qview .qno { font-family: var(--f-display); color: var(--accent); font-size: clamp(20px, 2vw, 30px); white-space: nowrap; }
.qview h1 { font-size: clamp(30px, 3.8vw, 60px); flex: 1; }
.qview .resp { color: var(--ink-2); font-size: clamp(16px, 1.5vw, 22px); white-space: nowrap; }
.qview .resp.locked { color: var(--danger); font-weight: 600; }

.bars { display: grid; gap: clamp(10px, 1.8vh, 22px); align-content: start; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.bar .lab { display: flex; justify-content: space-between; gap: 16px; font-size: clamp(18px, 2vw, 32px); font-weight: 600; }
.bar .lab .v { font-family: var(--f-mono); color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.bar .track { height: clamp(18px, 3.2vh, 40px); background: #ebe6da; border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; width: 0; background: var(--accent); border-radius: 0 4px 4px 0; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.bar.top .fill { background: var(--board); }

.words { display: flex; flex-wrap: wrap; gap: 12px 14px; align-content: flex-start; align-items: center; }
.word { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .3em .7em; line-height: 1.3; animation: pop .35s ease-out; max-width: 100%; word-break: keep-all; overflow-wrap: anywhere; }
.word .n { font-family: var(--f-mono); color: var(--accent); font-size: .6em; margin-left: 8px; vertical-align: middle; }
.hiddenres { flex: 1; display: grid; place-items: center; text-align: center; color: var(--ink-2); }
.hiddenres .big { font-family: var(--f-display); font-size: clamp(60px, 10vw, 160px); color: var(--board); line-height: 1; }
.hiddenres p { font-size: clamp(18px, 2vw, 28px); margin: 12px 0 0; }

.controls { display: flex; gap: 8px; padding: 10px 16px; background: #ece7dc; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; opacity: .25; transition: opacity .2s; }
.controls:hover, .controls:focus-within, .stage.touch .controls { opacity: 1; }
.controls .spacer { flex: 1; }
.controls .pos { font-family: var(--f-mono); font-size: 14px; color: var(--ink-2); padding: 0 6px; }
.controls .btn { min-height: 38px; padding: 0 14px; font-size: 14px; }
.controls .btn.on { background: var(--board); color: #fff; border-color: var(--board); }

@media (max-width: 760px) {
  .lobby { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .lobby .bigqr { width: min(60vw, 40vh); }
  .names { justify-content: center; }
  .stage .strip .url, .stage .strip .miniqr { display: none; }
  .stage .strip { padding: 10px 16px; }
  .stage .body { padding: 16px; }
  .qview .qhead { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="offline" id="offline" hidden>연결이 끊겼습니다. 다시 연결하는 중…</div>

<!-- 1. 방 만들기 / 열기 -->
<div class="page" id="startView" hidden>
  <header><h1>실시간 투표 · 발표자</h1><span class="meta">멘티미터처럼 휴대폰으로 투표·단답 받기</span></header>
  <div class="notice" id="setupNotice" hidden>
    아직 Firebase 설정이 안 되어 있습니다. <code>live-poll/firebase-config.js</code>에 값을 넣어 주세요. 순서는 <code>live-poll/README.md</code>에 있습니다.
  </div>
  <div class="cards" id="startCards">
    <form class="box" id="createForm" autocomplete="off">
      <h2>새 발표 만들기</h2>
      <div class="row"><label class="lbl" for="newTitle">발표 제목</label><input class="field" id="newTitle" maxlength="60" placeholder="예: 2학기 교직원 연수" required></div>
      <div class="row"><label class="lbl" for="newPin">관리 비밀번호</label><input class="field" id="newPin" type="password" minlength="4" maxlength="40" required autocomplete="new-password">
        <p class="hint">다른 컴퓨터(행사장 PC 등)에서 이 발표를 열 때 필요합니다. 4자 이상.</p></div>
      <button class="btn primary" type="submit" style="width:100%">만들기</button>
      <p class="err" id="createErr"></p>
    </form>
    <form class="box" id="openForm" autocomplete="off">
      <h2>만들어 둔 발표 열기</h2>
      <div class="row"><label class="lbl" for="openCode">참여 코드 (숫자 4자리)</label><input class="field" id="openCode" inputmode="numeric" maxlength="4" required></div>
      <div class="row"><label class="lbl" for="openPin">관리 비밀번호</label><input class="field" id="openPin" type="password" required autocomplete="current-password"></div>
      <button class="btn" type="submit" style="width:100%">열기</button>
      <p class="err" id="openErr"></p>
    </form>
  </div>
  <div class="recent" id="recent" hidden>
    <h2>이 컴퓨터에서 최근 연 발표</h2>
    <ul id="recentList"></ul>
  </div>
</div>

<!-- 2. 질문 편집 -->
<div class="page" id="editView" hidden>
  <div class="editbar">
    <span class="codebadge" id="editCode"></span>
    <span class="saved" id="savedMark"></span>
    <span class="spacer"></span>
    <button class="btn small ghost" type="button" id="toStartBtn">다른 발표</button>
    <button class="btn small" type="button" id="csvBtn">결과 내려받기 (CSV)</button>
    <button class="btn small primary" type="button" id="presentBtn">발표 화면 열기 ▶</button>
  </div>
  <div class="settings box">
    <div><label class="lbl" for="titleInput">발표 제목</label><input class="field" id="titleInput" maxlength="60"></div>
    <label class="toggle"><input type="checkbox" id="askNameInput"> 입장할 때 이름 받기</label>
    <p class="hint">참여 주소: <a id="joinLink" target="_blank" rel="noopener"></a> — 내 휴대폰으로 먼저 들어가 보세요.</p>
  </div>
  <div class="qlist" id="qlist"></div>
  <div class="addq">
    <button class="btn" type="button" data-add="choice">+ 객관식 질문</button>
    <button class="btn" type="button" data-add="text">+ 주관식(단답) 질문</button>
  </div>
</div>

<!-- 3. 발표 화면 -->
<div class="stage" id="stage" hidden>
  <div class="strip">
    <div class="miniqr" id="miniQr"></div>
    <div>
      <div class="join">참여 코드<b id="stripCode"></b></div>
      <div class="url" id="stripUrl"></div>
    </div>
    <span class="spacer"></span>
    <span class="people" id="people"></span>
  </div>
  <div class="body" id="stageBody"></div>
  <div class="controls">
    <button class="btn" type="button" id="prevBtn" title="← 키">◀ 이전</button>
    <span class="pos" id="pos"></span>
    <button class="btn" type="button" id="nextBtn" title="→ 키">다음 ▶</button>
    <button class="btn" type="button" id="lobbyBtn" title="0 키">입장 화면</button>
    <span class="spacer"></span>
    <button class="btn" type="button" id="resultsBtn" title="R 키">결과 가리기</button>
    <button class="btn" type="button" id="lockBtn" title="L 키">응답 마감</button>
    <button class="btn danger" type="button" id="clearBtn">이 질문 응답 지우기</button>
    <button class="btn" type="button" id="fsBtn" title="F 키">전체 화면</button>
    <button class="btn" type="button" id="backBtn">편집으로</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { ref, get, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { db, configured, signIn, explainError, watchConnection, safeGet, safeSet, toList, escapeHtml, joinUrl } from "./common.js";

const $ = (id) => document.getElementById(id);
const LETTERS = "ABCDEFGHIJ";
const MAX_OPTS = 8;

let toastTimer;
function toast(msg) {
  $("toast").textContent = msg; $("toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; }, 2600);
}
function view(name) {
  $("startView").hidden = name !== "start";
  $("editView").hidden = name !== "edit";
  $("stage").hidden = name !== "present";
}

let uid, code = null;

/* ================= 시작: 로그인 → 최근 발표 ================= */
boot();
async function boot() {
  view("start");
  if (!configured) { $("setupNotice").hidden = false; $("startCards").hidden = true; return; }
  try { uid = (await signIn()).uid; }
  catch (err) { $("createErr").textContent = explainError(err); return; }
  watchConnection($("offline"));
  renderRecent();
  const last = safeGet("livepoll-host-last");
  if (last && await isHost(last)) openRoom(last);
}

function recentList() {
  try { return JSON.parse(safeGet("livepoll-host-recent") || "[]"); } catch { return []; }
}
function remember(c, title) {
  const list = recentList().filter((r) => r.code !== c);
  list.unshift({ code: c, title });
  safeSet("livepoll-host-recent", JSON.stringify(list.slice(0, 6)));
  safeSet("livepoll-host-last", c);
}
function renderRecent() {
  const list = recentList();
  $("recent").hidden = list.length === 0;
  $("recentList").innerHTML = list.map((r) =>
    `<li><button class="btn" type="button" data-code="${escapeHtml(r.code)}"><span>${escapeHtml(r.title || "(제목 없음)")}</span><span class="c">${escapeHtml(r.code)}</span></button></li>`).join("");
}
$("recentList").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-code]");
  if (!b) return;
  if (await isHost(b.dataset.code)) openRoom(b.dataset.code);
  else { $("openCode").value = b.dataset.code; $("openPin").focus(); $("openErr").textContent = "이 컴퓨터에서는 비밀번호를 한 번 입력해야 합니다."; }
});

async function isHost(c) {
  try {
    const [h, m] = await Promise.all([get(ref(db, `hosts/${c}/${uid}`)), get(ref(db, `rooms/${c}/meta`))]);
    return h.exists() && m.exists();
  } catch { return false; }
}

$("createForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = $("newTitle").value.trim();
  const pin = $("newPin").value;
  if (pin.length < 4) { $("createErr").textContent = "비밀번호는 4자 이상이어야 합니다."; return; }
  $("createErr").textContent = "만드는 중…";
  for (let tries = 0; tries < 12; tries++) {
    const c = String(1000 + Math.floor(Math.random() * 9000));
    try {
      await set(ref(db, `secrets/${c}`), pin);   // 이미 쓰인 코드면 규칙이 거절 → 다른 번호로 재시도
    } catch { continue; }
    try {
      await set(ref(db, `hosts/${c}/${uid}`), pin);
      await set(ref(db, `rooms/${c}`), {
        meta: { title, askName: true, createdAt: Date.now() },
        questions: [
          { id: newId(), type: "choice", title: "오늘 연수 주제에 대해 얼마나 알고 계신가요?", options: ["처음 들어요", "들어 본 적 있어요", "조금 써 봤어요", "잘 알고 있어요"] },
          { id: newId(), type: "text", title: "오늘 연수에서 가장 궁금한 점을 한 단어로 적어 주세요." }
        ],
        state: { qid: null, locked: false, showResults: true }
      });
      $("createErr").textContent = "";
      openRoom(c);
    } catch (err) { $("createErr").textContent = explainError(err); }
    return;
  }
  $("createErr").textContent = "코드를 만들지 못했습니다. 잠시 후 다시 시도해 주세요.";
});

$("openForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const c = $("openCode").value.trim();
  $("openErr").textContent = "";
  try {
    await set(ref(db, `hosts/${c}/${uid}`), $("openPin").value);
  } catch {
    $("openErr").textContent = "코드나 비밀번호가 맞지 않습니다."; return;
  }
  if (!(await get(ref(db, `rooms/${c}/meta`))).exists()) { $("openErr").textContent = "이 코드의 발표가 지워졌습니다."; return; }
  openRoom(c);
});

function newId() {
  return "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

/* ================= 방 데이터 구독 ================= */
let meta = {}, questions = [], state = {}, participants = {}, responses = {};
let roomUnsubs = [];

async function openRoom(c) {
  roomUnsubs.forEach((u) => u()); roomUnsubs = [];
  code = c;
  const snap = await get(ref(db, `rooms/${c}`));
  const room = snap.val() || {};
  meta = room.meta || {};
  questions = toList(room.questions);
  state = room.state || {};
  remember(c, meta.title);

  roomUnsubs.push(onValue(ref(db, `rooms/${c}/state`), (s) => { state = s.val() || {}; renderStage(); }));
  roomUnsubs.push(onValue(ref(db, `rooms/${c}/participants`), (s) => { participants = s.val() || {}; renderStage(); }));
  roomUnsubs.push(onValue(ref(db, `rooms/${c}/responses`), (s) => { responses = s.val() || {}; renderStage(); }));

  if (new URLSearchParams(location.search).has("present")) enterPresent();
  else enterEdit();
}

/* ================= 편집 화면 ================= */
let saveTimer = null;
function enterEdit() {
  view("edit");
  history.replaceState(null, "", location.pathname);
  $("editCode").textContent = code;
  $("titleInput").value = meta.title || "";
  $("askNameInput").checked = meta.askName !== false;
  $("savedMark").textContent = "";
  $("joinLink").href = $("joinLink").textContent = joinUrl(code);
  renderEditor();
}

function scheduleSave() {
  $("savedMark").textContent = "저장 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 500);
}
async function saveNow() {
  clearTimeout(saveTimer); saveTimer = null;
  meta = { ...meta, title: $("titleInput").value.trim(), askName: $("askNameInput").checked };
  const clean = questions.map((q) => q.type === "choice"
    ? { id: q.id, type: "choice", title: q.title || "", options: toList(q.options).map((o) => o || "") }
    : { id: q.id, type: "text", title: q.title || "" });
  const patch = { meta, questions: clean };
  if (state.qid && !questions.some((q) => q.id === state.qid)) patch["state/qid"] = null;
  try {
    await update(ref(db, `rooms/${code}`), patch);
    $("savedMark").textContent = "저장됨 ✓";
    remember(code, meta.title);
  } catch (err) { $("savedMark").textContent = "저장 실패: " + explainError(err); }
}
async function flushSave() { if (saveTimer) await saveNow(); }

$("titleInput").addEventListener("input", scheduleSave);
$("askNameInput").addEventListener("change", scheduleSave);

function renderEditor() {
  $("qlist").innerHTML = questions.map((q, i) => {
    const opts = toList(q.options);
    return `<div class="qcard" data-i="${i}">
      <div class="head">
        <span class="num">${i + 1}</span>
        <select data-act="type" aria-label="질문 형식">
          <option value="choice"${q.type === "choice" ? " selected" : ""}>객관식</option>
          <option value="text"${q.type === "text" ? " selected" : ""}>주관식(단답)</option>
        </select>
        <span class="spacer"></span>
        <button class="iconbtn" type="button" data-act="up" title="위로" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="iconbtn" type="button" data-act="down" title="아래로" ${i === questions.length - 1 ? "disabled" : ""}>↓</button>
        <button class="iconbtn" type="button" data-act="del" title="질문 삭제">✕</button>
      </div>
      <input class="field title" data-act="title" maxlength="120" placeholder="질문을 입력하세요" value="${escapeHtml(q.title)}">
      ${q.type === "choice" ? `<div class="opts">
        ${opts.map((o, j) => `<div class="opt"><span class="letter">${LETTERS[j]}</span>
          <input class="field" data-act="opt" data-j="${j}" maxlength="60" placeholder="보기 ${j + 1}" value="${escapeHtml(o)}">
          <button class="iconbtn" type="button" data-act="delopt" data-j="${j}" title="보기 삭제" ${opts.length <= 2 ? "disabled" : ""}>✕</button></div>`).join("")}
        ${opts.length < MAX_OPTS ? `<div><button class="btn small ghost" type="button" data-act="addopt">+ 보기 추가</button></div>` : ""}
      </div>` : ""}
    </div>`;
  }).join("") || `<p class="notice">질문이 없습니다. 아래 버튼으로 추가하세요.</p>`;
}

$("qlist").addEventListener("input", (e) => {
  const card = e.target.closest(".qcard"); if (!card) return;
  const q = questions[Number(card.dataset.i)];
  if (e.target.dataset.act === "title") q.title = e.target.value;
  if (e.target.dataset.act === "opt") { const o = toList(q.options); o[Number(e.target.dataset.j)] = e.target.value; q.options = o; }
  scheduleSave();
});
$("qlist").addEventListener("change", (e) => {
  if (e.target.dataset.act !== "type") return;
  const q = questions[Number(e.target.closest(".qcard").dataset.i)];
  q.type = e.target.value;
  if (q.type === "choice" && toList(q.options).length < 2) q.options = ["", ""];
  renderEditor(); scheduleSave();
});
$("qlist").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const i = Number(b.closest(".qcard").dataset.i);
  const q = questions[i];
  const act = b.dataset.act;
  if (act === "up" && i > 0) [questions[i - 1], questions[i]] = [questions[i], questions[i - 1]];
  if (act === "down" && i < questions.length - 1) [questions[i + 1], questions[i]] = [questions[i], questions[i + 1]];
  if (act === "del") {
    const n = Object.keys(responses[q.id] || {}).length;
    if (!confirm(n ? `이 질문에 응답이 ${n}개 있습니다. 질문을 지울까요?` : "이 질문을 지울까요?")) return;
    questions.splice(i, 1);
  }
  if (act === "addopt") q.options = [...toList(q.options), ""];
  if (act === "delopt") { const o = toList(q.options); o.splice(Number(b.dataset.j), 1); q.options = o; }
  renderEditor(); scheduleSave();
  if (act === "addopt") { const inputs = $("qlist").querySelectorAll(`.qcard[data-i="${i}"] [data-act="opt"]`); inputs[inputs.length - 1]?.focus(); }
});
document.querySelector(".addq").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-add]"); if (!b) return;
  questions.push(b.dataset.add === "choice"
    ? { id: newId(), type: "choice", title: "", options: ["", ""] }
    : { id: newId(), type: "text", title: "" });
  renderEditor(); scheduleSave();
  $("qlist").lastElementChild.querySelector('[data-act="title"]').focus();
});

$("toStartBtn").addEventListener("click", async () => {
  await flushSave();
  roomUnsubs.forEach((u) => u()); roomUnsubs = [];
  safeSet("livepoll-host-last", "");
  code = null; renderRecent(); view("start");
});
$("presentBtn").addEventListener("click", async () => { await flushSave(); enterPresent(); });
$("csvBtn").addEventListener("click", downloadCsv);

/* ================= 발표 화면 ================= */
function enterPresent() {
  view("present");
  history.replaceState(null, "", "?present");
  const url = joinUrl(code);
  $("stripCode").textContent = code;
  $("stripUrl").textContent = url.replace(/^https?:\/\//, "");
  $("miniQr").innerHTML = qrSvg(url);
  lastBodyKey = "";
  renderStage();
}

function qrSvg(text) {
  if (typeof qrcode !== "function") return "";
  const qr = qrcode(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount();
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="참여 QR 코드"><path d="${d}" fill="#1d2a2c"/></svg>`;
}

const currentIndex = () => questions.findIndex((q) => q.id === state.qid);
let lastBodyKey = "";

function renderStage() {
  if ($("stage").hidden) return;
  const people = Object.keys(participants).length;
  $("people").textContent = `참여 ${people}명`;
  const idx = currentIndex();
  const q = questions[idx];
  $("pos").textContent = q ? `${idx + 1} / ${questions.length}` : `입장 · ${questions.length}문항`;
  $("prevBtn").disabled = idx < 0;
  $("nextBtn").disabled = idx >= questions.length - 1;
  $("lobbyBtn").disabled = idx < 0;
  const show = state.showResults !== false, locked = state.locked === true;
  for (const id of ["resultsBtn", "lockBtn", "clearBtn"]) $(id).hidden = !q;
  $("resultsBtn").textContent = show ? "결과 가리기" : "결과 보이기";
  $("resultsBtn").classList.toggle("on", !show);
  $("lockBtn").textContent = locked ? "응답 다시 받기" : "응답 마감";
  $("lockBtn").classList.toggle("on", locked);

  const body = $("stageBody");
  if (!q) {
    // 입장 화면: 큰 QR + 코드 + 들어온 사람 이름
    if (lastBodyKey !== "lobby") {
      const url = joinUrl(code);
      body.innerHTML = `<div class="lobby">
        <div class="bigqr">${qrSvg(url)}</div>
        <div>
          <h1>${escapeHtml(meta.title || "실시간 투표")}</h1>
          <p class="how">휴대폰 카메라로 QR을 찍거나</p>
          <p class="how"><b>${escapeHtml(url.replace(/^https?:\/\//, "").replace(/\?code=.*$/, ""))}</b> 에 들어가서 코드 입력</p>
          <div class="bigcode">${escapeHtml(code)}</div>
          <div class="names" id="names"></div>
        </div></div>`;
      lastBodyKey = "lobby";
    }
    syncChips($("names"), Object.entries(participants)
      .filter(([, p]) => p && p.name)
      .map(([u, p]) => ({ key: u, html: escapeHtml(p.name) })), "span");
    return;
  }

  const answers = Object.values(responses[q.id] || {});
  const respText = `응답 ${answers.length}${people ? " / " + people : ""}명${locked ? " · 마감" : ""}`;
  if (lastBodyKey !== "q:" + q.id + ":" + show + ":" + q.type) {
    body.innerHTML = `<div class="qview">
      <div class="qhead"><span class="qno">Q${idx + 1}</span><h1>${escapeHtml(q.title)}</h1><span class="resp" id="respCount"></span></div>
      <div id="results"></div></div>`;
    lastBodyKey = "q:" + q.id + ":" + show + ":" + q.type;
  }
  $("respCount").textContent = respText;
  $("respCount").classList.toggle("locked", locked);

  const res = $("results");
  if (!show) {
    res.className = "hiddenres";
    res.innerHTML = `<div><div class="big">${answers.length}</div><p>명이 응답했습니다</p></div>`;
  } else if (q.type === "choice") {
    renderBars(res, toList(q.options), answers);
  } else {
    renderWords(res, answers);
  }
}

function renderBars(res, opts, answers) {
  const counts = opts.map((_, i) => answers.filter((a) => a === i).length);
  const total = answers.length;
  const max = Math.max(...counts, 0);
  if (res.className !== "bars" || res.children.length !== opts.length) {
    res.className = "bars";
    res.innerHTML = opts.map((o, i) => `<div class="bar"><div class="lab"><span>${LETTERS[i]}. ${escapeHtml(o)}</span><span class="v"></span></div><div class="track"><div class="fill"></div></div></div>`).join("");
  }
  [...res.children].forEach((el, i) => {
    const pct = total ? Math.round((counts[i] / total) * 100) : 0;
    el.querySelector(".v").textContent = `${counts[i]}명 · ${pct}%`;
    // 막대 길이는 가장 많은 항목을 꽉 채우는 기준으로 (비율 숫자는 전체 응답 대비)
    el.querySelector(".fill").style.width = max ? (counts[i] / max) * 100 + "%" : "0";
    el.classList.toggle("top", max > 0 && counts[i] === max);
  });
}

function renderWords(res, answers) {
  // 같은 답(띄어쓰기·대소문자 무시)은 하나로 묶고, 많이 나온 답일수록 크게
  const groups = new Map();
  for (const a of answers) {
    if (typeof a !== "string") continue;
    const key = a.replace(/\s+/g, " ").trim().toLowerCase();
    const g = groups.get(key) || { key, text: a.trim(), n: 0 };
    g.n++; groups.set(key, g);
  }
  const list = [...groups.values()];
  const max = Math.max(1, ...list.map((g) => g.n));
  if (res.className !== "words") { res.className = "words"; res.innerHTML = ""; }
  res.querySelector(".empty")?.remove();
  syncChips(res, list.map((g) => {
    const size = 26 + (max > 1 ? ((g.n - 1) / (max - 1)) * 38 : 0);
    return {
      key: g.key,
      html: escapeHtml(g.text) + (g.n > 1 ? `<span class="n">×${g.n}</span>` : ""),
      style: `font-size:clamp(${Math.round(size * 0.7)}px, ${(size / 12).toFixed(2)}vw, ${Math.round(size * 1.4)}px)`
    };
  }), "span", "word");
  if (!list.length) res.insertAdjacentHTML("beforeend", `<p class="empty" style="color:var(--muted);font-size:clamp(18px,2vw,28px)">아직 응답이 없습니다.</p>`);
}

// 칩 목록을 key로 맞춰 갱신: 새로 생긴 것만 붙이고(그것만 튀어나오는 애니메이션), 사라진 것은 뺀다
function syncChips(container, items, tag, cls = "") {
  const existing = new Map([...container.querySelectorAll(":scope > [data-k]")].map((el) => [el.dataset.k, el]));
  for (const it of items) {
    let el = existing.get(it.key);
    if (!el) {
      el = document.createElement(tag);
      if (cls) el.className = cls;
      el.dataset.k = it.key;
      container.appendChild(el);
    }
    if (el.innerHTML !== it.html) el.innerHTML = it.html;
    if ((el.getAttribute("style") || "") !== (it.style || "")) el.setAttribute("style", it.style || "");
    existing.delete(it.key);
  }
  for (const el of existing.values()) el.remove();
}

function setState(patch) {
  return update(ref(db, `rooms/${code}/state`), patch).catch((err) => toast(explainError(err)));
}
function go(idx) {
  const q = questions[idx];
  setState({ qid: q ? q.id : null, locked: false });
}
$("prevBtn").addEventListener("click", () => go(currentIndex() - 1));
$("nextBtn").addEventListener("click", () => go(currentIndex() + 1));
$("lobbyBtn").addEventListener("click", () => go(-1));
$("resultsBtn").addEventListener("click", () => setState({ showResults: state.showResults === false }));
$("lockBtn").addEventListener("click", () => setState({ locked: state.locked !== true }));
$("clearBtn").addEventListener("click", () => {
  const q = questions[currentIndex()]; if (!q) return;
  if (!confirm(`“${q.title}” 응답을 모두 지울까요? 되돌릴 수 없습니다.`)) return;
  remove(ref(db, `rooms/${code}/responses/${q.id}`)).catch((err) => toast(explainError(err)));
});
$("fsBtn").addEventListener("click", toggleFullscreen);
$("backBtn").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  enterEdit();
});
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}
document.addEventListener("keydown", (e) => {
  if ($("stage").hidden || e.target.closest("input, textarea, select")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); if (currentIndex() < questions.length - 1) go(currentIndex() + 1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); if (currentIndex() >= 0) go(currentIndex() - 1); }
  else if (k === "0" || k === "Home") go(-1);
  else if (k === "f" || k === "F") toggleFullscreen();
  else if (k === "r" || k === "R") $("resultsBtn").click();
  else if (k === "l" || k === "L") $("lockBtn").click();
});
$("stage").addEventListener("touchstart", () => $("stage").classList.add("touch"), { once: true, passive: true });

/* ================= CSV 내려받기 ================= */
function downloadCsv() {
  const cell = (v) => {
    const s = String(v ?? "");
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const uids = new Set(Object.keys(participants));
  for (const q of questions) for (const u of Object.keys(responses[q.id] || {})) uids.add(u);
  const rows = [["이름", ...questions.map((q, i) => `Q${i + 1}. ${q.title}`)]];
  for (const u of uids) {
    rows.push([
      (participants[u] && participants[u].name) || "",
      ...questions.map((q) => {
        const a = (responses[q.id] || {})[u];
        if (a === undefined || a === null) return "";
        return q.type === "choice" ? (toList(q.options)[a] ?? a) : a;
      })
    ]);
  }
  rows.push([]);
  rows.push(["[집계]"]);
  questions.forEach((q, i) => {
    if (q.type !== "choice") return;
    const answers = Object.values(responses[q.id] || {});
    rows.push([`Q${i + 1}. ${q.title}`]);
    toList(q.options).forEach((o, j) => rows.push(["", o, answers.filter((a) => a === j).length]));
  });
  const csv = "﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `${(meta.title || "실시간투표").replace(/[\\/:*?"<>|]/g, "_")}_${code}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
</script>
